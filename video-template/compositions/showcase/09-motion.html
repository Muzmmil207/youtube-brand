<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }
      </style>

      <div
        id="root"
        data-composition-id="motion"
        data-width="1920"
        data-height="1080"
        data-duration="10"
      >
        <div class="hf-scene">
          <div class="hf-dots"></div>

          <header class="hf-header">
            <p class="hf-label">Design system · 09 Motion</p>
            <h1 class="hf-h1">Motion with a job</h1>
            <p class="hf-body-lg hf-muted hf-header__sub">
              Enter, point, connect. One beat, then hold still.
            </p>
          </header>

          <div class="hf-main">
            <div class="hf-split hf-split--wide-left hf-split--stretch hf-fill">
              <div class="hf-card" style="overflow: hidden" data-anim="fade-up" data-anim-at="0.15">
                <div class="hf-spotlight" data-anim="fade" data-anim-at="0.4"></div>
                <span class="hf-label">Pointer highlight</span>
                <h3 class="hf-h3">Point at the change</h3>
                <span class="hf-connector hf-connector--h" data-anim="grow-x" data-anim-at="0.45"></span>
                <div class="hf-row hf-row--between" style="margin-top: auto">
                  <span class="hf-h4">Linen shirt</span>
                  <span style="position: relative; margin-right: 26px">
                    <span class="hf-h3 hf-num">$68</span>
                    <span class="hf-highlight" style="inset: -16px -22px" data-anim="highlight" data-anim-at="0.7">
                      <span class="hf-highlight__tag" data-layout-allow-overflow>New price</span>
                    </span>
                    <svg class="hf-cursor" style="right: -20px; bottom: -28px" viewBox="0 0 24 24" data-anim="cursor" data-anim-at="0.8">
                      <path d="M5 3l14 8-6.2 1.4L10 19 5 3Z" />
                    </svg>
                  </span>
                </div>
              </div>

              <div class="hf-card" data-anim="fade-up" data-anim-at="0.3">
                <span class="hf-label">Connectors</span>
                <h3 class="hf-h3">Connect the pieces</h3>
                <div class="hf-row hf-fill" style="justify-content: space-between; gap: 12px">
                  <span class="hf-icon-badge hf-icon-badge--sm"><svg class="hf-icon"><use href="assets/icons.svg#bag" /></svg></span>
                  <svg class="hf-arrow" width="72" height="24" viewBox="0 0 72 24"><path d="M2 12h62m-9-7 9 7-9 7" data-anim="draw" data-anim-at="0.55" /></svg>
                  <span class="hf-icon-badge hf-icon-badge--sm"><svg class="hf-icon"><use href="assets/icons.svg#cart" /></svg></span>
                  <svg class="hf-arrow" width="72" height="24" viewBox="0 0 72 24"><path d="M2 12h62m-9-7 9 7-9 7" data-anim="draw" data-anim-at="0.65" /></svg>
                  <span class="hf-icon-badge hf-icon-badge--sm hf-icon-badge--accent"><svg class="hf-icon"><use href="assets/icons.svg#dollar" /></svg></span>
                </div>
              </div>
            </div>

            <div class="hf-grid hf-grid--3">
              <div class="hf-card" data-anim="fade-up" data-anim-at="0.5">
                <div class="hf-row">
                  <span class="hf-pulse" data-anim="pulse" data-anim-at="0.85"><i class="hf-pulse__ring"></i></span>
                  <span class="hf-label">Pulse</span>
                </div>
                <div class="hf-metric">
                  <span class="hf-metric__value hf-count" data-anim="count" data-to="128" data-anim-at="0.7">128</span>
                  <span class="hf-small hf-muted">orders today</span>
                </div>
              </div>

              <div class="hf-card" data-anim="fade-up" data-anim-at="0.6">
                <span class="hf-label">Draw</span>
                <svg class="hf-growth__spark" viewBox="0 0 300 88" preserveAspectRatio="none" style="height: 96px">
                  <path d="M0 74 C 40 70, 58 44, 92 50 S 142 72, 176 46 S 232 18, 300 8" data-anim="draw" data-anim-at="0.75" />
                </svg>
                <span class="hf-small hf-muted">Line draw for trends</span>
              </div>

              <div class="hf-card" data-anim="fade-up" data-anim-at="0.7">
                <span class="hf-label">Grow</span>
                <div class="hf-metric">
                  <span class="hf-metric__value hf-num">72%</span>
                  <span class="hf-small hf-muted">of profile complete</span>
                </div>
                <div class="hf-progress" style="--v: 0.72">
                  <span class="hf-progress__fill" data-anim="grow-x" data-anim-at="0.85"></span>
                </div>
              </div>
            </div>
          </div>

          <footer class="hf-footer">
            <span>Learn Shopify Today</span>
            <span>Motion · 09</span>
          </footer>
        </div>
      </div>

      <script src="scripts/hf-motion.js"></script>
      <script>
        HF.register("motion");
      </script>
    </template>
  </body>
</html>
