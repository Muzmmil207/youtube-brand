<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }
      </style>

      <div
        id="root"
        data-composition-id="layout"
        data-width="1920"
        data-height="1080"
        data-duration="10"
      >
        <div class="hf-scene">
          <div class="hf-dots"></div>

          <header class="hf-header">
            <p class="hf-label">Design system · 02 Layout</p>
            <h1 class="hf-h1">Structure first</h1>
            <p class="hf-body-lg hf-muted hf-header__sub">
              One idea per scene, one primary visual, generous space.
            </p>
          </header>

          <div class="hf-main">
            <div class="hf-bento hf-fill" data-anim-group="fade-up" data-anim-at="0.2" data-stagger="0.07">
              <div class="hf-card hf-span-2 hf-tall">
                <span class="hf-label">Split</span>
                <h3 class="hf-h3">Explain with two halves</h3>
                <p class="hf-card__body">
                  Put the visual on one side and the idea on the other.
                </p>
                <div class="hf-split hf-split--stretch hf-fill" style="gap: 12px">
                  <div class="hf-mock"></div>
                  <div class="hf-mock hf-mock--lime"></div>
                </div>
              </div>

              <div class="hf-card hf-span-2">
                <span class="hf-label">Bento</span>
                <h3 class="hf-h3">Group related proof</h3>
                <div
                  class="hf-fill"
                  style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 12px"
                >
                  <div class="hf-mock"></div>
                  <div class="hf-mock hf-mock--lime"></div>
                  <div class="hf-mock"></div>
                  <div class="hf-mock"></div>
                  <div class="hf-mock"></div>
                  <div class="hf-mock"></div>
                </div>
              </div>

              <div class="hf-card">
                <span class="hf-label">Stack</span>
                <h3 class="hf-h4">Order the steps</h3>
                <div class="hf-stack hf-stack--tight hf-fill">
                  <div class="hf-mock" style="flex: 1"></div>
                  <div class="hf-mock" style="flex: 1"></div>
                  <div class="hf-mock hf-mock--lime" style="flex: 1"></div>
                </div>
              </div>

              <div class="hf-card">
                <span class="hf-label">Grid</span>
                <h3 class="hf-h4">Compare at a glance</h3>
                <div
                  class="hf-fill"
                  style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px"
                >
                  <div class="hf-mock"></div>
                  <div class="hf-mock"></div>
                  <div class="hf-mock"></div>
                  <div class="hf-mock hf-mock--lime"></div>
                </div>
              </div>
            </div>
          </div>

          <footer class="hf-footer">
            <span>Learn Shopify Today</span>
            <span>Layout · 02</span>
          </footer>
        </div>
      </div>

      <script src="scripts/hf-motion.js"></script>
      <script>
        HF.register("layout");
      </script>
    </template>
  </body>
</html>
