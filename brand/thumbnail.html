<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn Shopify Today — Thumbnail template 1280×720</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1280px; height: 720px; }

  .glow-a { width: 900px; height: 900px; right: -260px; top: -300px; }
  .glow-b { width: 700px; height: 700px; left: -300px; bottom: -360px; }
  .dots { background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse 60% 70% at 72% 30%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse 60% 70% at 72% 30%, #000 0%, transparent 70%); }

  .frame {
    position: absolute; inset: 0;
    padding: 58px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .pill { font-size: 19px; padding: 10px 22px; }

  .ep { font-size: 19px; color: var(--dim); letter-spacing: 0.02em; }

  /* Headline: 2 short lines, one word in lime. Never more than 4 words per line. */
  .headline {
    font-size: 104px;
    line-height: 0.94;
    font-weight: 700;
    letter-spacing: -0.04em;
    max-width: 700px;
  }
  .headline em { font-style: normal; color: var(--lime); }

  .foot { display: flex; align-items: center; gap: 14px; }
  .foot .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 18px 2px rgba(149,191,71,0.55); }
  .foot span { font-size: 23px; color: var(--muted); letter-spacing: -0.01em; }

  /* Right side: mock admin panel, the "screen" of the tutorial */
  .stage { position: absolute; right: 46px; top: 50%; transform: translateY(-50%); width: 460px; height: 460px; }
  .panel {
    position: absolute; right: 0; top: 60px;
    width: 400px; padding: 26px;
    border-radius: 24px;
    transform: rotate(-4deg);
  }
  .panel .bar { height: 14px; border-radius: 7px; background: rgba(255,255,255,0.13); }
  .panel .bar.sm { height: 11px; background: rgba(255,255,255,0.08); }
  .panel .row { display: flex; gap: 12px; margin-top: 18px; }
  .panel .thumb { width: 92px; height: 68px; border-radius: 12px; background: linear-gradient(135deg, rgba(149,191,71,0.35), rgba(149,191,71,0.08)); border: 1px solid rgba(149,191,71,0.3); }
  .panel .stack { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .panel .cta {
    margin-top: 22px; height: 44px; border-radius: 12px;
    background: var(--lime); color: #0B0F06;
    display: grid; place-items: center;
    font-size: 17px; font-weight: 700; letter-spacing: 0.02em;
  }
  .panel .head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .panel .avatar { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.14); }

  .cursor { display: none; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow lime glow-a"></div>
  <div class="glow cool glow-b"></div>

  <div class="frame">
    <div class="top">
      <div class="pill">Themes &amp; Design</div>
      <div class="ep">Ep. 12</div>
    </div>

    <div class="headline">Any theme.<br><em>Zero</em> code.</div>

    <div class="foot">
      <div class="dot"></div>
      <span>Learn Shopify Today</span>
    </div>
  </div>

  <div class="stage">
    <div class="panel chip">
      <div class="head">
        <div class="avatar"></div>
        <div style="display:flex;flex-direction:column;gap:8px;flex:1">
          <div class="bar" style="width:62%"></div>
          <div class="bar sm" style="width:38%"></div>
        </div>
      </div>
      <div class="row">
        <div class="thumb"></div>
        <div class="stack">
          <div class="bar" style="width:88%"></div>
          <div class="bar sm" style="width:70%"></div>
          <div class="bar sm" style="width:52%"></div>
        </div>
      </div>
      <div class="row">
        <div class="thumb" style="background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.1)"></div>
        <div class="stack">
          <div class="bar" style="width:76%"></div>
          <div class="bar sm" style="width:60%"></div>
          <div class="bar sm" style="width:44%"></div>
        </div>
      </div>
      <div class="cta">Save changes</div>
    </div>

    <svg class="cursor" viewBox="0 0 24 24" fill="none">
      <path d="M5 3l14 8-6.2 1.6L9.6 19 5 3Z" fill="#95BF47" stroke="#0B0F06" stroke-width="1.2"/>
    </svg>
  </div>
</body>
</html>
