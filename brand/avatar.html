<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn Shopify Today — Channel avatar 800×800</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* YouTube crops the profile picture to a circle. Keep the mark inside the
     centre ~62% so nothing gets clipped. */
  html, body { width: 800px; height: 800px; }

  .glow-a { width: 900px; height: 900px; left: -50px; top: -100px; }

  .stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }

  .mark {
    width: 340px; height: 340px;
    border-radius: 96px;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #1D2A15, #10140D);
    border: 2px solid rgba(149, 191, 71, 0.35);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08), 0 0 120px -20px rgba(149, 191, 71, 0.45);
  }
  .mark svg { width: 176px; height: 176px; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow lime glow-a"></div>
  <div class="stage">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#95BF47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.2 8h15.6l-1.5 11.4a1.6 1.6 0 0 1-1.6 1.4H7.3a1.6 1.6 0 0 1-1.6-1.4L4.2 8Z"/>
        <path d="M8.4 8V6.6a3.6 3.6 0 0 1 7.2 0V8"/>
        <path d="M10.4 12.2v5l4.7-2.5-4.7-2.5Z" fill="#95BF47" stroke="#95BF47" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
